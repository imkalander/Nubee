<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nubee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&family=UnifrakturMaguntia&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;--fg:#e9e4d8;--mute:#9b9689;--rule:#47443d;--link:#a9bfd6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;background:#000;color:var(--fg);font:18px/1.65 'Newsreader',Georgia,'Times New Roman',serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 56px}
.top{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mute);padding:12px 0;border-bottom:1px solid var(--rule)}
h1.name{font:400 clamp(44px,9vw,96px)/1.05 'UnifrakturMaguntia','Old English Text MT',Georgia,serif;text-align:center;margin:20px 0 4px}
.tag{text-align:center;font-style:italic;color:var(--mute);margin:0 0 16px}
nav{border-top:3px double var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:4px 24px;align-items:center;padding:8px 0}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--fg);font:inherit;font-weight:700;padding:6px 0;cursor:pointer}
nav button[aria-current=true]{border-color:var(--fg)}
nav input{margin-left:auto;flex:1 1 180px;max-width:300px;background:#000;border:1px solid var(--rule);color:var(--fg);font:inherit;font-size:16px;padding:6px 10px}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0 4px}
.choose button{background:#000;color:var(--fg);border:1px solid var(--fg);font:inherit;font-weight:700;padding:14px 10px;cursor:pointer}
.choose button:hover{background:var(--fg);color:#000}
.cols{display:grid;grid-template-columns:1fr 2fr 1fr;margin-top:24px}
.col{padding:0 24px;border-left:1px solid var(--rule)}
.col:first-child{border-left:0;padding-left:0}
.col:last-child{padding-right:0}
.sec{font-size:16px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:0 0 12px}
.lnk{display:block;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.lnk:hover .hl{text-decoration:underline}
.hl{font-weight:700;font-size:22px;line-height:1.2;margin:2px 0 6px}
.lead .hl{font-size:clamp(30px,4.4vw,44px);line-height:1.1}
.meta{color:var(--mute);font-size:14px}
.lnk p{margin:0 0 10px}
.sub{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.ph{aspect-ratio:4/3;display:grid;place-items:center;color:var(--mute);font-style:italic;border:1px solid var(--rule);background:linear-gradient(135deg,#1b1b1b,#2b2925 60%,#101010);margin-bottom:8px}
.lnk img,.pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px;margin-top:22px}
.item{border-top:1px solid var(--rule);padding-top:12px}
.page{max-width:680px;margin:28px auto 0}
.page h2{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:6px 0 10px}
.page p{margin:0 0 1.1em}
.back{background:none;border:0;color:var(--link);font:inherit;cursor:pointer;padding:0}
.note{color:var(--mute);font-style:italic;margin:18px 0 0}
footer{margin-top:40px;padding-top:12px;border-top:3px double var(--rule);text-align:center;color:var(--mute);font-size:14px}
@media(max-width:820px){
.cols{grid-template-columns:1fr}
.col,.col:first-child,.col:last-child{border-left:0;padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid var(--rule)}
.choose{grid-template-columns:1fr}
nav input{margin-left:0;max-width:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.page figure{margin:22px 0}
.page img{display:block;max-width:100%;height:auto}
.page h3{font-size:24px;line-height:1.25;margin:1.6em 0 .5em}
.page ul,.page ol{padding-left:1.2em;margin:0 0 1.1em}
.page li{margin-bottom:.8em}
.page blockquote{margin:0 0 1.1em;padding-left:16px;border-left:2px solid var(--rule);font-style:italic}
.fila{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.fila figure{flex:1 1 150px;margin:0}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span id="fecha"></span><span>Edición digital</span></div>
<svg viewBox="0 0 64 40" width="64" height="40" fill="#fff" aria-hidden="true" style="display:block;margin:22px auto 0"><circle cx="20" cy="26" r="11"/><circle cx="34" cy="17" r="14"/><circle cx="48" cy="26" r="11"/><rect x="20" y="26" width="28" height="11"/></svg>
<h1 class="name" id="nombre"></h1>
<p class="tag" id="lema"></p>
<nav aria-label="Secciones">
<button data-go="home">Portada</button>
<button data-go="writings">Escritos</button>
<button data-go="photos">Fotos</button>
<button data-go="about">La historia</button>
<input id="q" type="search" placeholder="Buscar un escrito" aria-label="Buscar un escrito">
</nav>
<main id="app"></main>
<footer id="pie"></footer>
</div>
<script src="contenido.js"></script>
<script>


const app=document.getElementById('app'),qi=document.getElementById('q');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
const ps=a=>a.map(t=>`<p>${esc(t)}</p>`).join('');
const pic=p=>p.img?`<img src="${esc(p.img)}" alt="${esc(p.title)}">`:`<div class="ph">Aquí irá tu foto</div>`;
let S={view:'home',q:'',id:null};

const wBtn=(w,cls)=>`<button class="lnk ${cls||''}" data-w="${w.id}"><div class="meta">${esc(w.cat)}, ${fmt(w.date)}</div><div class="hl">${esc(w.title)}</div><p>${esc(w.excerpt)}</p></button>`;
const pBtn=p=>`<button class="lnk" data-p="${p.id}">${pic(p)}<div class="meta">${fmt(p.date)}</div><div class="hl">${esc(p.title)}</div><p>${esc(p.caption)}</p></button>`;

const views={
 home(){
  return `<div class="choose"><button data-go="writings">Leer los escritos</button><button data-go="search">Buscar un escrito</button><button data-go="photos">Ver las fotos</button></div>
  <div class="cols">
   <div class="col"><h2 class="sec">La historia</h2>${ps(SITE.about)}</div>
   <div class="col">${wBtn(W[0],'lead')}${W.slice(1,3).map(w=>`<div class="sub">${wBtn(w)}</div>`).join('')}</div>
   <div class="col">${P.length?`<h2 class="sec">En fotos</h2>${pBtn(P[0])}`:`<h2 class="sec">Más escritos</h2>${W.slice(3,6).map((w,i)=>i?`<div class="sub">${wBtn(w)}</div>`:wBtn(w)).join('')}`}</div>
  </div>`;
 },
 writings(){
  const q=norm(S.q.trim());
  const l=W.filter(w=>!q||norm(w.title+' '+w.excerpt+' '+w.cat+' '+w.html.replace(/<[^>]+>/g,' ')).includes(q));
  const head=q?`<p class="note">${l.length} resultado${l.length===1?'':'s'} para “${esc(S.q.trim())}”</p>`:'';
  const empty=l.length?'':`<p class="note">No encontré escritos con esa búsqueda. Prueba con otra palabra o borra el texto del buscador.</p>`;
  return `${head}${empty}<div class="grid">${l.map(w=>`<div class="item">${wBtn(w)}</div>`).join('')}</div>`;
 },
 photos(){return P.length?`<div class="grid">${P.map(p=>`<div class="item">${pBtn(p)}</div>`).join('')}</div>`:`<div class="page"><p class="note">Aquí aparecerán las fotos, cada una con su propia historia. Por ahora no hay ninguna publicada.</p></div>`;},
 about(){return `<div class="page"><h2>La historia</h2>${ps(SITE.about)}</div>`;},
 writing(){
  const w=W.find(x=>x.id===S.id);
  return `<div class="page"><button class="back" data-go="writings">Volver a los escritos</button><div class="meta" style="margin-top:14px">${esc(w.cat)}, ${fmt(w.date)}</div><h2>${esc(w.title)}</h2>${w.html}</div>`;
 },
 photo(){
  const p=P.find(x=>x.id===S.id);
  return `<div class="page"><button class="back" data-go="photos">Volver a las fotos</button><div class="pic" style="margin-top:14px">${pic(p)}</div><div class="meta">${fmt(p.date)}</div><h2>${esc(p.title)}</h2>${ps(p.story)}</div>`;
 }
};

function render(){
  app.innerHTML=views[S.view]();
  const tab={home:'home',writings:'writings',writing:'writings',photos:'photos',photo:'photos',about:'about'}[S.view];
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===tab)));
  window.scrollTo(0,0);
}
function go(v,id){S.view=v;S.id=id||null;if(v!=='writings'){S.q='';qi.value='';}render();}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-w],[data-p]');if(!b)return;
  if(b.dataset.w)return go('writing',+b.dataset.w);
  if(b.dataset.p)return go('photo',+b.dataset.p);
  if(b.dataset.go==='search'){go('writings');qi.focus();return;}
  go(b.dataset.go);
});
qi.addEventListener('input',()=>{S.q=qi.value;S.view='writings';S.id=null;render();});

document.title=SITE.name;
document.getElementById('nombre').textContent=SITE.name;
document.getElementById('lema').textContent=SITE.tagline;
document.getElementById('fecha').textContent=new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('pie').textContent=SITE.name+', '+new Date().getFullYear();
render();
</script>
</body>
</html>
